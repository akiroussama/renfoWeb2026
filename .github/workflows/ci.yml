name: ci
on:
  pull_request:
  push:
    branches: ["build/**", "verify/**"]
permissions: {}
jobs:
  cp0-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      # Accepte une branche étudiante du dépôt ou d'un fork ; le runner valide son nom.
      - name: Persona CP0 et checkpoints cumulatifs
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type == 'User' && github.event.pull_request.user.login != github.repository_owner
        env:
          CP0_STUDENT_LOGIN: ${{ github.event.pull_request.user.login }}
          CP_BRANCH: ${{ github.head_ref }}
        run: node scripts/run-checkpoint.js --branch="$CP_BRANCH" --author="$CP0_STUDENT_LOGIN"
      - name: Tests du kit
        run: npm run test:unit
