name: Peer reviewers

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: peer-reviewers-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  peer-reviewers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted base code only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          repository: ${{ github.repository }}
          persist-credentials: false
      - name: Assign peer reviewers
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');

            const TARGET = 2;
            const prNumber = context.payload.pull_request.number;

            // Lit l'etat reel de la PR via l'API.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Ignore les brouillons.
            if (pr.draft) {
              core.info('PR en brouillon : aucune assignation de relecteurs.');
              return;
            }
            if (pr.state !== 'open') {
              core.info(`PR ${pr.state} : aucune assignation de relecteurs.`);
              return;
            }

            const author = pr.user.login;
            const owner = context.repo.owner;
            const baseSha = pr.base.sha;

            // Charge le roster depuis le code de confiance (base uniquement).
            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'config', 'participants.json');
            let participants = [];
            try {
              const raw = fs.readFileSync(configPath, 'utf8');
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed.participants)) {
                participants = parsed.participants;
              }
            } catch (error) {
              core.setFailed(`Lecture impossible de config/participants.json (base) : ${error.message}`);
              return;
            }
            const rosterLower = new Set(participants.map((p) => String(p.login).toLowerCase()));

            // Deduit les logins termines depuis les dossiers students/ sur le SHA de base.
            let completedLogins = [];
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'students',
                ref: baseSha,
              });
              const entries = Array.isArray(data) ? data : [];
              completedLogins = entries.filter((entry) => entry.type === 'dir').map((entry) => entry.name);
            } catch (error) {
              if (error.status === 404) {
                core.info('Dossier students/ absent sur la base : liste des termines vide.');
                completedLogins = [];
              } else {
                throw error;
              }
            }

            // Conserve les relecteurs déjà demandés (choix humain).
            const existingRequested = (pr.requested_reviewers || []).map((u) => u.login).filter(Boolean);

            // Conserve les auteurs de reviews precedentes eligibles (roster ou owner).
            let previousEligible = [];
            try {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const seen = new Set();
              for (const review of reviews) {
                const login = review && review.user && review.user.login;
                if (!login) continue;
                const lower = login.toLowerCase();
                if (lower === author.toLowerCase()) continue;
                if (seen.has(lower)) continue;
                seen.add(lower);
                if (rosterLower.has(lower) || lower === owner.toLowerCase()) {
                  previousEligible.push(login);
                }
              }
            } catch (error) {
              core.setFailed(`Lecture des reviews existantes impossible : ${error.message}`);
              return;
            }

            // Dedup sans tenir compte de la casse et exclut l'auteur.
            const coveredLower = new Set();
            for (const login of [...existingRequested, ...previousEligible]) {
              if (login.toLowerCase() === author.toLowerCase()) continue;
              coveredLower.add(login.toLowerCase());
            }

            const needed = TARGET - coveredLower.size;
            if (needed <= 0) {
              core.info(`Déjà ${coveredLower.size}/2 relecteurs couverts : aucune nouvelle demande.`);
              await core.summary.addRaw(`### Relecteurs\n\nDéjà ${coveredLower.size}/2 relecteurs couverts, aucune action.`).write();
              return;
            }

            // Importe le selecteur teste depuis le code de confiance (base uniquement).
            const libUrl = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'lib', 'reviewers.js')).href;
            const { selectReviewers } = await import(libUrl);

            const { reviewers, missing } = selectReviewers({
              author,
              participants,
              completedLogins,
              owner,
              random: Math.random,
            });

            // Ne complete que jusqu'a 2, sans doublon ni notification inutile.
            const seenNew = new Set(coveredLower);
            const newReviewers = [];
            for (const login of reviewers || []) {
              const lower = String(login).toLowerCase();
              if (lower === author.toLowerCase()) continue;
              if (seenNew.has(lower)) continue;
              seenNew.add(lower);
              newReviewers.push(login);
              if (newReviewers.length >= needed) break;
            }

            const shortage = needed - newReviewers.length;

            if (newReviewers.length === 0) {
              core.warning(`Aucun nouveau relecteur disponible. Il manque ${needed}/2 relecteur(s) : ajout manuel requis, sans réduire l'exigence de 2 approbations.`);
              core.info(`Auteur : ${author} | Sélection : (aucune) | Manquant : ${needed}`);
              await core.summary.addRaw(`### Relecteurs\n\nAuteur : ${author}\n\nSélection : (aucune)\n\nIl manque ${needed}/2 relecteur(s). Ajout manuel requis.`).write();
              return;
            }

            // Demande uniquement si la liste est non vide. Aucun commentaire automatique.
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: newReviewers,
              });
            } catch (error) {
              if (error.status === 422) {
                core.setFailed(`Demande de relecteurs rejetée (422) pour [${newReviewers.join(', ')}] : ${error.message}`);
                return;
              }
              throw error;
            }

            core.info(`Auteur : ${author} | Relecteurs demandés : ${newReviewers.join(', ')} | Manquant : ${shortage > 0 ? shortage : 0} (sélecteur : ${missing || 0})`);
            if (shortage > 0) {
              core.warning(`Il manque encore ${shortage} relecteur(s) pour atteindre 2. Exigence de 2 approbations maintenue, ajout manuel requis.`);
            }
            await core.summary.addList(newReviewers).addRaw(`\nAuteur : ${author}\nIl manque : ${shortage > 0 ? shortage : 0} relecteur(s) pour atteindre 2.`).write();
